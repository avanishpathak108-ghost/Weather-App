<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="container" id="signupForm">
    <h1>Create Account</h1>
    <label for="name">Full Name</label>
    <input id="name" type="text" required minlength="2" placeholder="Your name">
    <label for="email">Email</label>
    <input id="email" type="email" required placeholder="you@example.com">
    <label for="password">Password</label>
    <input id="password" type="password" required minlength="6" placeholder="At least 6 characters">
    <label for="confirmPassword">Confirm Password</label>
    <input id="confirmPassword" type="password" required minlength="6" placeholder="Repeat password">
    <button type="submit">Sign Up</button>
    <p id="message"></p>
  </form>
  <script src="script.js"></script>
</body>
</html>
